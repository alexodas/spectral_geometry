name: Fast independent Palomar Comparator

# Lightweight feedback for Challenge/Solution iterations. The existing
# Palomar preparation checks still run the complete Lean verification first.
on:
  pull_request:
    paths:
      - 'Challenge.lean'
      - 'Solution.lean'
      - 'comparator.json'
      - 'formalization.yaml'
      - 'SpectralGeometry.lean'
      - 'SpectralGeometry/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/check-unified-comparator.py'
      - 'scripts/check-palomar-layout.py'
      - 'scripts/verify-comparator.sh'
      - 'scripts/diagnose-comparator.py'
      - '.github/workflows/comparator-fast.yml'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-comparator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Comparator only (cached Lean build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Ensure pinned Lean toolchain (retry transient downloads)
        run: |
          for attempt in 1 2 3 4 5; do
            if lake --version; then exit 0; fi
            echo "Lean download failed; retry $attempt/5"
            sleep $((5 * attempt))
          done
          exit 1

      # The same exact cache key is produced by the full Lean job. The
      # Challenge and Solution are deliberately omitted from the key; Lake
      # recompiles them as needed while reusing unchanged source .olean files.
      # Changing any substantive Lean source or dependency invalidates the key.
      - name: Restore compiled substantive Lean modules
        id: project-olean-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lean-source-v1-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'SpectralGeometry.lean', 'SpectralGeometry/**/*.lean') }}

      - name: Check Comparator inputs and metadata
        run: |
          python3 scripts/check-palomar-layout.py
          python3 scripts/check-unified-comparator.py
          ruby scripts/validate-formalization.rb
      - name: Restore pinned Mathlib objects
        run: lake exe cache get
      - name: Build Challenge and Solution incrementally
        run: lake build Challenge Solution

      # Save before the Comparator step: a statement mismatch may fail the
      # comparison, but compilation results are still valid for the next fix.
      - name: Save compiled project modules for next comparison
        if: steps.project-olean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lean-source-v1-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'SpectralGeometry.lean', 'SpectralGeometry/**/*.lean') }}
      - name: Compare with the bundled independent kernels
        id: comparator
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          timeout --signal=TERM --kill-after=30s 1800 bash scripts/verify-comparator.sh
      - name: Diagnose declaration differences after comparison failure
        if: failure() && steps.comparator.outcome == 'failure'
        run: python3 scripts/diagnose-comparator.py
