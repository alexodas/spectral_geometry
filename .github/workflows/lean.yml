name: Lean 4 / Mathlib proof check

on:
  # Reused by Palomar on pull requests and pushes; independently available on demand.
  workflow_call:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Ensure pinned Lean toolchain (retry transient downloads)
        run: |
          for attempt in 1 2 3 4 5; do
            if lake --version; then exit 0; fi
            echo "Lean download failed; retry $attempt/5"
            sleep $((5 * attempt))
          done
          exit 1
      # Cache the complete Lake workspace, not just the project's .lake/build:
      # Mathlib/dependency sources and their compiled objects live under
      # .lake/packages. Restoring them avoids downloading ~9000 artifacts
      # again on each disposable runner. The manifest/toolchain isolate
      # incompatible dependencies; Lake still validates and builds all
      # targets. This job is the only cache writer.
      - name: Restore compiled project modules
        id: project-olean-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: ${{ runner.os }}-${{ runner.arch }}-lean-workspace-v3-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('SpectralGeometry.lean', 'SpectralGeometry/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lean-workspace-v3-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      # Idempotent: on a warm workspace this finds no missing artifacts;
      # on cold/missing/corrupt entries it fetches the pinned Mathlib cache.
      - name: Verify or download pinned Mathlib cache
        run: lake exe cache get
      - name: Compile and kernel-check Lean proof
        run: lake build SpectralGeometry Challenge Solution
      - name: Cache verified source build for subsequent Comparator iterations
        if: steps.project-olean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: ${{ runner.os }}-${{ runner.arch }}-lean-workspace-v3-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('SpectralGeometry.lean', 'SpectralGeometry/**/*.lean') }}
