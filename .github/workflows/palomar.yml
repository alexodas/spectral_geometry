name: Palomar preparation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    # Run the original proof job itself: Palomar cannot pass if Lean fails.
    name: Full Lean 4 / Mathlib proof check
    uses: ./.github/workflows/lean.yml

  lean-and-comparator:
    # Only run the Comparator-specific checks after every original Lean step succeeds.
    needs: lean
    # Match the PalomarTemplate disposable-runner environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Ensure pinned Lean toolchain (retry transient downloads)
        run: |
          for attempt in 1 2 3 4 5; do
            if lake --version; then exit 0; fi
            echo "Lean download failed; retry $attempt/5"
            sleep $((5 * attempt))
          done
          exit 1
      - name: Static Palomar packaging and metadata checks
        run: |
          python3 scripts/check-palomar-layout.py
          python3 scripts/check-unified-comparator.py
          python3 scripts/check-lean-sources.py
          ruby scripts/validate-formalization.rb
          python3 scripts/check-full-proof-coverage.py
          python3 scripts/check-no-proof-holes.py
      # The earlier Lean job is the sole cache writer. Restore its entire
      # verified Lake workspace before invoking Mathlib's cache client:
      # .lake/packages contains Mathlib and other pinned dependencies,
      # not only the project's .lake/build objects.
      - name: Restore verified Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: ${{ runner.os }}-${{ runner.arch }}-lean-workspace-v3-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('SpectralGeometry.lean', 'SpectralGeometry/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lean-workspace-v3-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      # The official cache client otherwise downloads .ltar archives into
      # ~/.cache/mathlib even when the .olean files already exist in .lake.
      # Skip that transfer on a complete restored workspace; keep the
      # official pinned Mathlib cache as the fallback for a cold cache.
      - name: Ensure pinned Mathlib artifacts
        run: |
          if test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean; then
            echo "Restored compiled Mathlib: skipping redundant archive download"
          else
            echo "Mathlib build absent: fetching pinned cache artifacts"
            lake exe cache get
          fi
      - name: Build complete mathematical library and Comparator modules
        run: lake build SpectralGeometry Challenge Solution
      - name: Compare exact protected preparation with bundled kernels
        id: comparator
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          # PalomarTemplate's AppArmor adjustment is confined to this disposable runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          timeout --signal=TERM --kill-after=30s 1800 bash scripts/verify-comparator.sh
      - name: Diagnose declaration differences after comparison failure
        if: failure() && steps.comparator.outcome == 'failure'
        run: python3 scripts/diagnose-comparator.py
