<path d="M1024 348H1124" stroke-width="5" stroke="#7c3aed" stroke-linecap="round"/>
<text x="940" y="339" text-anchor="middle" font-size="13" fill="#147d92">A</text>
<text x="1074" y="339" text-anchor="middle" font-size="13" fill="#7c3aed">B</text>
<text x="1007" y="365" text-anchor="middle" font-size="13" font-weight="bold">E* = 13/4 + √2 ≈ 4.664</text>
<text x="1007" y="318" text-anchor="middle" font-size="11" fill="#15803d">E* + 1/122</text>
<text x="1007" y="386" text-anchor="middle" font-size="11" fill="#15803d">E* − 1/122</text>
<text x="1007" y="418" text-anchor="middle" font-size="13" font-weight="bold">Exact multiplicity 2</text>
<text x="1007" y="440" text-anchor="middle" font-size="12">No other real spectrum in open window</text>
<text x="600" y="525" text-anchor="middle" font-size="12" fill="#475569">Schematic energy scale · no claim of a filled bulk interval or of noise robustness</text>
