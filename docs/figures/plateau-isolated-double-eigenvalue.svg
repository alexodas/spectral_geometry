<path d="M625 162V369" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
<text x="440" y="150" font-size="13">C = 4 + 2√2 ≈ 6.828</text>
<text x="625" y="388" font-size="12" text-anchor="middle">R = 1 + √2</text>
<text x="762" y="388" text-anchor="end" font-size="12">r</text>
<text x="442" y="334" font-size="12">1</text>
<text x="542" y="297" font-size="13" transform="rotate(-42 542 297)">1 + r²</text>
<text x="694" y="185" text-anchor="middle" font-size="12">constant plateau</text>
