<text x="600" y="58" text-anchor="middle" font-size="14" fill="#475569">Infinite Ammann–Beenker graph · bounded plateau · real spectral theorem</text>
<rect x="16" y="76" width="370" height="424" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
