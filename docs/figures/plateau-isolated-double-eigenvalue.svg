<text x="1007" y="194" font-size="13" text-anchor="middle">σ(C I + L) ⊆ [C, C + 1]</text>
<text x="1007" y="212" font-size="12" text-anchor="middle">[6.828, 7.828] (enclosure)</text>
<text x="1007" y="259" font-size="12" text-anchor="middle" fill="#64748b">Other spectral energies may occur</text>
<rect x="854" y="302" width="306" height="91" rx="5" fill="#dcfce7"/>
<path d="M854 302H1160 M854 393H1160" stroke="#15803d" stroke-dasharray="5 4"/>
