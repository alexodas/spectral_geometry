<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc">
<title id="title">An isolated double eigenvalue without global confinement</title>
<desc id="desc">Three panels show the exact central graph with two alternating compact patterns, radial truncated potential with fixed first-ring correction, and a double eigenvalue isolated from the full real spectrum below the uniform bulk enclosure. The energy panel is not to scale.</desc>
