<text x="426" y="468" font-size="12">H − (C I + L): rank ≤ 17</text>
<text x="813" y="103" font-size="17" font-weight="bold">3  Full real spectral separation</text>
<path d="M839 455V133l-5 9m5-9 5 9" fill="none" stroke="#64748b" stroke-width="1.5"/>
