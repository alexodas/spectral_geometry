<g text-anchor="middle" font-size="13" fill="#526978"><text x="385" y="233">separated</text><text x="733" y="233">separated</text><text x="559" y="402" font-size="15">Complete candidate neighborhoods are disjoint; exterior graph omitted.</text></g>
<g transform="translate(39 456)"><circle cx="12" cy="12" r="10" fill="#156e9a"/><text x="30" y="17" font-size="17" font-weight="bold">A: L a = (3/16) a</text><circle cx="306" cy="12" r="10" fill="#b65b16"/><text x="324" y="17" font-size="17" font-weight="bold">B: L b = (1/4) b</text><text x="608" y="17" font-size="17" font-weight="bold">2N mutually orthogonal modes</text></g>
<text x="39" y="510" font-size="16">Every copied mode has squared norm 8 and vanishes outside its own ring.</text><text x="39" y="542" font-size="15" fill="#526978">The two eigenvalues differ: degenerate, individually isolated qubits are a separate goal.</text>
