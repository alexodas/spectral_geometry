<text x="38" y="43" font-size="27" font-weight="bold">One infinite graph, arbitrarily many identical local wave patterns</text>
<text x="38" y="72" font-size="15" fill="#526978">L9.2 · Exact recurrence and compact eigenstates · spatial layout schematic</text>
