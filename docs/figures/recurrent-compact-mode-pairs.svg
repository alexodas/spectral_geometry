<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="575" viewBox="0 0 1120 575" role="img" aria-labelledby="title desc">
<title id="title">Exact spatial replication of two compact localized eigenstates</title><desc id="desc">Three schematic copies of the same 17-vertex central patch have disjoint surrounding neighborhoods on one infinite graph. Each first ring has alternating blue amplitudes and each second ring alternating orange amplitudes. All copies have eigenvalues 3/16 and 1/4, squared norms eight, and mutual orthogonality. Placement is schematic; no computed positions, spectral gaps or degenerate qubits are claimed.</desc>
<defs><g id="patch"><circle r="132" fill="#edf5f7" stroke="#597c85" stroke-width="1.7" stroke-dasharray="6 5"/><path d="M0 0 L50.000 0.000 M50.000 0.000 L85.355 -35.355 L35.355 -35.355" fill="none" stroke="#879ca8" stroke-width="1.8"/><path d="M0 0 L35.355 -35.355 M35.355 -35.355 L35.355 -85.355 L0.000 -50.000" fill="none" stroke="#879ca8" stroke-width="1.8"/><path d="M0 0 L0.000 -50.000 M0.000 -50.000 L-35.355 -85.355 L-35.355 -35.355" fill="none" stroke="#879ca8" stroke-width="1.8"/><path d="M0 0 L-35.355 -35.355 M-35.355 -35.355 L-85.355 -35.355 L-50.000 -0.000" fill="none" stroke="#879ca8" stroke-width="1.8"/><path d="M0 0 L-50.000 -0.000 M-50.000 -0.000 L-85.355 35.355 L-35.355 35.355" fill="none" stroke="#879ca8" stroke-width="1.8"/><path d="M0 0 L-35.355 35.355 M-35.355 35.355 L-35.355 85.355 L-0.000 50.000" fill="none" stroke="#879ca8" stroke-width="1.8"/><path d="M0 0 L-0.000 50.000 M-0.000 50.000 L35.355 85.355 L35.355 35.355" fill="none" stroke="#879ca8" stroke-width="1.8"/><path d="M0 0 L35.355 35.355 M35.355 35.355 L85.355 35.355 L50.000 0.000" fill="none" stroke="#879ca8" stroke-width="1.8"/><circle r="5.5" fill="#62727d"/><circle cx="50.000" cy="0.000" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="50.000" y="4.800" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="85.355" cy="-35.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="85.355" y="-30.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="35.355" cy="-35.355" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="35.355" y="-30.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="35.355" cy="-85.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="35.355" y="-80.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="0.000" cy="-50.000" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="0.000" y="-45.200" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-35.355" cy="-85.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-35.355" y="-80.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-35.355" cy="-35.355" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-35.355" y="-30.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-85.355" cy="-35.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-85.355" y="-30.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-50.000" cy="-0.000" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-50.000" y="4.800" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-85.355" cy="35.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-85.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-35.355" cy="35.355" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-35.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-35.355" cy="85.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-35.355" y="90.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-0.000" cy="50.000" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-0.000" y="54.800" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="35.355" cy="85.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="35.355" y="90.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="35.355" cy="35.355" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="35.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="85.355" cy="35.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="85.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text></g><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#596c7d"/></marker></defs>
