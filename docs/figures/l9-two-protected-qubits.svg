<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
  <title id="title">Two independently protected localized qubits — proposed L9 architecture</title>
  <desc id="desc">Conceptual energy diagram, not a proved spectrum. The bulk spectrum may contain essential spectrum above C. Two hypothetical two-state subspaces at different rest energies lie below C. Each is degenerate at rest and temporarily split under local control, with a separate positive isolation margin from all other spectral energies.</desc>
  <defs>
    <pattern id="bulk" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9L9 0" stroke="#94a3b8" stroke-width="1" opacity=".48"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="858" height="498" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="430" y="31" fill="#172b4d" font-size="20" font-weight="bold" text-anchor="middle">Proposed architecture: two individually protected localized qubits</text>
    <text x="430" y="54" fill="#475569" font-size="14" text-anchor="middle">Conceptual illustration — not yet proved; energies are schematic</text>
    <path d="M58 454V76l-5 10m5-10 5 10" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="33" y="91" font-size="16" font-style="italic" fill="#334155">E</text>
    <rect x="88" y="76" width="728" height="83" rx="5" fill="#f1f5f9"/>
    <rect x="88" y="76" width="728" height="83" rx="5" fill="url(#bulk)"/>
    <rect x="267" y="94" width="370" height="48" rx="4" fill="#f8fafc" opacity=".94"/>
    <text x="452" y="114" text-anchor="middle" fill="#334155" font-size="18" font-weight="bold">Bulk spectral enclosure</text>
    <text x="452" y="133" text-anchor="middle" fill="#475569" font-size="14">May contain essential spectrum</text>
    <path d="M80 159H816" stroke="#64748b" stroke-width="1.3"/>
    <text x="74" y="164" text-anchor="end" font-size="16" font-style="italic" fill="#334155">C</text>
    <text x="278" y="184" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Controls off</text>
    <text x="570" y="184" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Controls on</text>
    <rect x="88" y="199" width="728" height="102" rx="6" fill="#ecfdf5"/>
    <path d="M88 199H816M88 301H816" fill="none" stroke="#15803d" stroke-dasharray="6 5" opacity=".7"/>
    <text x="105" y="221" font-size="15" font-weight="bold" fill="#166534">Qubit 1</text>
    <path d="M199 250H365" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <text x="282" y="240" text-anchor="middle" font-size="15" fill="#166534">E₁ (degenerate)</text>
    <path d="M505 235H635M505 265H635" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <text x="570" y="288" text-anchor="middle" font-size="13" fill="#166534">Temporary splitting</text>
    <path d="M717 204h9v92h-9" fill="none" stroke="#15803d" stroke-width="1.5"/>
    <text x="738" y="246" font-size="14" fill="#166534">Individual</text>
    <text x="738" y="264" font-size="14" fill="#166534">gap</text>
    <rect x="88" y="327" width="728" height="102" rx="6" fill="#eff6ff"/>
    <path d="M88 327H816M88 429H816" fill="none" stroke="#2563eb" stroke-dasharray="6 5" opacity=".7"/>
    <text x="105" y="349" font-size="15" font-weight="bold" fill="#1d4ed8">Qubit 0</text>
    <path d="M199 378H365" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="282" y="368" text-anchor="middle" font-size="15" fill="#1d4ed8">E₀ (degenerate)</text>
    <path d="M505 363H635M505 393H635" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="570" y="416" text-anchor="middle" font-size="13" fill="#1d4ed8">Temporary splitting</text>
    <path d="M717 332h9v92h-9" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="738" y="374" font-size="14" fill="#1d4ed8">Individual</text>
    <text x="738" y="392" font-size="14" fill="#1d4ed8">gap</text>
    <text x="430" y="474" text-anchor="middle" font-size="14" fill="#475569">Target: distinct rest energies, independent local controls, and full-spectrum isolation.</text>
  </g>
</svg>
