<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">Exact protected state preparation with arbitrarily weak controls</title>
<desc id="desc">Scientific schematic of the fifth registered theorem. Two actual eight-site central rings, eight matched inter-ring edges, quadratic potential and crossing correction, three consecutive signed control pulses and their exact two plane energies, with certified exterior separation at least f over 128. All controls off gives the common rest energy. No noise robustness is asserted.</desc>
