<text x="37" y="463" font-size="18" font-weight="bold">4  Instantaneous energies — splitting and reunion inside a protected spectral window</text>
<text x="37" y="485" font-size="13" fill="#475569">Example signed settings, not to scale. Levels are constant on each open pulse interval.</text>
