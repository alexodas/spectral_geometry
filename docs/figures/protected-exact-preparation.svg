<text x="727" y="618" text-anchor="middle" font-size="14" fill="#a21caf">E* + 2q/k</text>
<text x="175" y="651" text-anchor="middle" font-size="13">Rest</text><text x="337" y="651" text-anchor="middle" font-size="13">Edge pulse</text><text x="532" y="651" text-anchor="middle" font-size="13">Onsite pulse</text><text x="727" y="651" text-anchor="middle" font-size="13">Edge pulse</text><text x="880" y="651" text-anchor="middle" font-size="13">Rest</text>
<rect x="952" y="504" width="210" height="155" rx="6" fill="#ecfdf5" stroke="#86efac"/>
<text x="1057" y="528" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Exterior separation</text>
<text x="1057" y="558" text-anchor="middle" font-size="24" font-weight="bold" fill="#166534">≥ f/128</text>
<text x="1057" y="580" text-anchor="middle" font-size="13" fill="#166534">for every active setting</text>
<text x="1057" y="605" text-anchor="middle" font-size="12" fill="#166534">0 &lt; f &lt; 1; baseline 1/128</text>
<text x="1057" y="627" text-anchor="middle" font-size="12" fill="#166534">Not the internal splitting</text>
<text x="37" y="674" font-size="11" fill="#475569">Shaded region is schematic, not a fixed certified interval; the bound is relative to each setting's two plane energies.</text>
<rect x="20" y="699" width="1160" height="91" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="37" y="725" font-size="17" font-weight="bold">Verified result</text>
<text x="37" y="750" font-size="15">Dark state D → eⁱᵠ(aD + bF),  |a|² + |b|² = 1   ·   Exact zero leakage   ·   Unit norm throughout</text>
<text x="37" y="774" font-size="14">E* = 13/4 + √2 at zero controls. Arbitrarily weak ideal controls, not a claim of robustness to noise.</text>
