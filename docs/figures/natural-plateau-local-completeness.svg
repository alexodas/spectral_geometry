<g font-family="Arial, Helvetica, sans-serif" fill="#16344a">
<text x="34" y="42" font-size="28" font-weight="bold">Exactly two local modes, infinitely many global replicas</text>
<text x="34" y="70" font-size="16" fill="#526978">One unchanged canonical plateau · C = 4 + 2√2 outside the central defect</text>
<rect x="30" y="94" width="330" height="375" rx="12" fill="#f8fbfc" stroke="#d9e4e8"/>
<text x="48" y="123" font-size="20" font-weight="bold">1 · Local completeness</text>
<g transform="translate(195 264) scale(.86)"><use xlink:href="#patch"/></g>
<text x="195" y="398" font-size="16" text-anchor="middle" font-weight="bold">Certified 17-site cell</text>
<text x="195" y="421" font-size="14" text-anchor="middle">Only A or B as eigenvector directions</text>
<text x="195" y="443" font-size="14" text-anchor="middle">for this exact support</text>
<rect x="375" y="94" width="715" height="375" rx="12" fill="#f8fbfc" stroke="#d9e4e8"/>
<text x="395" y="123" font-size="20" font-weight="bold">2 · Infinite global multiplicity</text>
<text x="395" y="146" font-size="14" fill="#526978">Arbitrarily many disjoint remote cells on the same infinite graph</text>
<g transform="translate(510 238) scale(.53)"><use xlink:href="#patch"/></g><text x="510" y="326" font-size="14" text-anchor="middle" font-weight="bold">Cell 1</text>
<g transform="translate(730 238) scale(.53)"><use xlink:href="#patch"/></g><text x="730" y="326" font-size="14" text-anchor="middle" font-weight="bold">Cell 2</text>
<g transform="translate(950 238) scale(.53)"><use xlink:href="#patch"/></g><text x="950" y="326" font-size="14" text-anchor="middle" font-weight="bold">Cell N</text>
<text x="840" y="245" font-size="26" text-anchor="middle" fill="#879ca8">⋯</text>
<path d="M425 365 H1040" stroke="#b65b16" stroke-dasharray="5 4" stroke-width="1.5"/><path d="M425 412 H1040" stroke="#156e9a" stroke-dasharray="5 4" stroke-width="1.5"/>
<path d="M476 365 h68" stroke="#b65b16" stroke-width="5" stroke-linecap="round"/><path d="M476 412 h68" stroke="#156e9a" stroke-width="5" stroke-linecap="round"/>
<path d="M696 365 h68" stroke="#b65b16" stroke-width="5" stroke-linecap="round"/><path d="M696 412 h68" stroke="#156e9a" stroke-width="5" stroke-linecap="round"/>
<path d="M916 365 h68" stroke="#b65b16" stroke-width="5" stroke-linecap="round"/><path d="M916 412 h68" stroke="#156e9a" stroke-width="5" stroke-linecap="round"/>
<text x="395" y="352" font-size="15" font-weight="bold" fill="#b65b16">B: E = C + 1/4</text><text x="395" y="399" font-size="15" font-weight="bold" fill="#156e9a">A: E = C + 3/16</text>
<text x="1060" y="388" font-size="13" text-anchor="end" fill="#526978">ΔE = 1/16</text>
<text x="730" y="448" font-size="15" text-anchor="middle" font-weight="bold">Same two energies in every copy · all copied modes orthogonal</text>
<rect x="30" y="484" width="1060" height="118" rx="12" fill="#edf5f7" stroke="#c7dce2"/>
<text x="48" y="510" font-size="20" font-weight="bold">3 · No individual residual gap</text>
<text x="48" y="535" font-size="16">A distant orthogonal replica can have exactly the same energy as a mode in the chosen cell.</text>
<text x="48" y="558" font-size="15">Both full eigenspaces are infinite-dimensional. A positive collective gap is still an open question.</text>
<text x="48" y="580" font-size="15">Outside the uniform bulk spectrum, the central defect gives eigenspace dimension at most 17.</text>
<text x="34" y="628" font-size="13" fill="#526978">Blue: first-ring A mode · Orange: second-ring B mode · Remote placements and energy diagram schematic; exterior graph omitted.</text>
</g></svg>
