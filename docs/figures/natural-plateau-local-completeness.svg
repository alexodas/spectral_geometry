<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Exactly two local eigenvector directions, infinitely many global replicas</title>
<desc id="desc">One certified seventeen-site recurrent cell has two compact ring eigenstates A and B, with alternating signs. On the unchanged plateau, arbitrarily many disjoint cells share energies C+3/16 and C+1/4. Both eigenspaces have infinite dimension and no individual residual gap exists. A collective positive gap remains open. The placements and energy panel are schematic.</desc>
