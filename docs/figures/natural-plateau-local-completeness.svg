e="white" stroke-width="1.4"/><text x="0.000" y="-45.200" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-35.355" cy="-85.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-35.355" y="-80.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-35.355" cy="-35.355" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-35.355" y="-30.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-85.355" cy="-35.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-85.355" y="-30.555" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-50.000" cy="-0.000" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-50.000" y="4.800" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-85.355" cy="35.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-85.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="-35.355" cy="35.355" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-35.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-35.355" cy="85.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="-35.355" y="90.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="-0.000" cy="50.000" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="-0.000" y="54.800" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="35.355" cy="85.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="35.355" y="90.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">+</text><circle cx="35.355" cy="35.355" r="10.5" fill="#156e9a" stroke="white" stroke-width="1.4"/><text x="35.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text><circle cx="85.355" cy="35.355" r="10.5" fill="#b65b16" stroke="white" stroke-width="1.4"/><text x="85.355" y="40.155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">−</text></g></defs>
