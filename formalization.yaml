    "name": "Exact dark-state protection and bright-mode forcing under a single-edge perturbation of an infinite octagonal graph",
    "description": "We study how changing the weight of one graph edge affects two compact localized modes on a concrete infinite, quadratically confined Ammann–Beenker octagonal vertex graph. A previously registered result established that these two modes exhaust an exactly two-dimensional eigenspace at one energy; that result remains unchanged and is not being resubmitted. The present theorem addresses the local perturbation itself, not another eigenvalue classification. It identifies a normalized equal-amplitude 'dark' combination that remains an exact eigenstate of the full infinite operator for every real change in the chosen edge weight. The orthogonal 'bright' combination responds differently: its exact matrix element contains a computable shift plus a term coupling it to all states outside the original two-mode plane. The theorem gives an explicit upper bound for that extra term, proportional to the strength of the edge change and to the norm of the external component. These are rigorous identities and estimates on the natural domain of an unbounded real self-adjoint Hamiltonian, with no finite-size truncation or assumption that the two-mode plane stays invariant. The result is relevant to mathematical spectral theory, especially local rank-one perturbations and compact eigenstates, and to theoretical studies of localized modes in quasicrystals, flat-band networks and photonic analogues. It does not claim a time-dependent quantum propagator, an eigenvalue-splitting law, a preparation protocol or mathematical priority.",
