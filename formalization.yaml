    "divergences": "The model is one specified centered open-window Ammann–Beenker vertex graph with a quadratic confining potential, a fixed eight-neighbor tuning and an edge between the lattice lifts (1,0,0,0) and (1,1,0,0). The Hilbert space is real l2, not a completed complex dynamical model; the operator acts on its natural unbounded onsite domain. The edge modification is a rank-one graph-Laplacian term, not an arbitrary potential or a change of every bond. The dark equation is exact; the bright equation retains a generally nonzero coupling to the orthogonal complement, so its nominal shift epsilon/4 is not asserted to be an eigenvalue shift or physical rotation frequency. No Schrödinger unitary group, pulse propagation, adiabatic passage, target-state preparation, or full-quasicrystal-hull uniformity is claimed. The exact multiplicity result registered in 2026 and the separately certified 1/128 spectral gap are background, not new Comparator-selected conclusions."
