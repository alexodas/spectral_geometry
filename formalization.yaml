    "name": "Exact dark-state protection and bright-mode forcing under a single-edge perturbation of an infinite octagonal graph",
    "description": "We study how changing the weight of one edge affects two compact localized modes on a concrete infinite, quadratically confined Ammann–Beenker octagonal graph. An earlier Palomar-registered theorem proved that these modes span the entire two-dimensional eigenspace at one energy; that theorem is not being resubmitted. Here the graph, edge and unbounded operator are fixed explicitly, and the state space consists of real square-summable functions on all graph vertices. We prove one combined theorem for every real edge-weight change and every state in the operator's natural domain. First, the normalized equal-amplitude 'dark' combination remains an exact eigenstate of the full operator at the original energy, whatever the edge strength. Second, the complementary 'bright' combination has an exact response: its unperturbed energy coefficient increases by one quarter of the edge-weight change, but an additional term depends on the part of the state outside the original two-mode plane. Third, the absolute size of that correction is at most twice the magnitude of the edge-weight change times the norm of the external part. Thus the theorem distinguishes a truly protected mode from a mode with explicit, quantitatively bounded coupling to the rest of an infinite graph, without assuming that a two-state approximation is invariant. This may interest mathematicians studying spectral theory, discrete Schrödinger operators and rank-one perturbations, as well as physicists studying localized modes in quasicrystals, flat-band networks and photonic analogues. No finite-size truncation, time-dependent quantum propagator, eigenvalue-splitting formula, state-preparation protocol or mathematical priority is claimed.",
