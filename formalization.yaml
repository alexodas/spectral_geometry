    "name": "A One-Edge Change Splits Two Energy Levels on an Infinite Octagonal Graph",
    "description": "An infinite octagonal network has two localized wave patterns with the same energy. We change the strength of just one edge connecting them. If that change is nonzero and at most one part in 1,024 in absolute size, there are exactly two nearby energy levels. One stays at the original energy and has only one independent wave pattern. The other is also simple: it rises when the edge is strengthened and falls when the edge is weakened. Its energy differs from the original energy plus one quarter of the edge change by no more than 112 times the square of the change. The theorem also shows that the moving wave has a nonzero contribution from the original bright pattern and bounds how much of it spreads beyond the original two patterns.\n\nThese are exact results for the entire infinite network, not for a finite sample or an isolated two-state approximation. The theorem does not prove a time-dependent quantum-control procedure. The research direction was conceived and directed by Alessandro Odasso, who is not a mathematician. According to the maintainer, AI generated the mathematical proofs and formalization under his direction. Whether the theorem is new or scientifically significant has not yet been independently assessed.",
